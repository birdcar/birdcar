name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: birdcar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d birdcar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: birdcar_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Add Flux license
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
        run: composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"

      - name: Setup Application
        env:
          MOTION_TOKEN: ${{ secrets.MOTION_TOKEN }}
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Load published writing without development dependencies
        env:
          APP_ENV: production
        run: |
          APP_ENV=local php artisan migrate:fresh --force --no-interaction
          php artisan authorization:sync --no-interaction
          ACTOR_ID=$(php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $actor = App\Models\User::query()->create(['name' => 'Archive Import', 'email' => 'archive-import@example.test', 'password' => Illuminate\Support\Str::random(32)]);
          $actor->assignRole(App\Authorization\Publishing\Role::Author->value);
          echo $actor->id;
          PHP
          )
          php artisan publishing:import-archive --write --actor="$ACTOR_ID" --confirm-production-write --no-interaction
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $articles = $app->make(App\Actions\Publishing\ReadPublishedWriting::class)->all();

          if ($articles->isEmpty()) {
              throw new RuntimeException('No published writing loaded.');
          }

          echo 'Loaded '.$articles->count()." published articles.\n";
          PHP
